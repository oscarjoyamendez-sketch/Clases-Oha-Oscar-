<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Clases OHA - Oscar</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px 16px 40px}
.hero{background:#111827;color:white;border-radius:30px;padding:26px 24px;margin-bottom:18px}
.kicker{font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.next{font-size:42px;font-weight:900;line-height:1.05;margin:8px 0}
.sub{font-size:19px;font-weight:700;opacity:.9}
.days{display:flex;gap:10px;overflow:auto;padding:4px 0 16px}
.days button{border:0;border-radius:24px;padding:13px 20px;background:white;font-weight:800;font-size:16px;white-space:nowrap}
.days button.active{background:#4d69df;color:white}
.card{background:white;border-radius:26px;padding:20px 18px;margin:12px 0;display:flex;gap:18px;align-items:center;box-shadow:0 5px 20px rgba(17,24,39,.06)}
.bar{width:10px;align-self:stretch;border-radius:8px;min-height:74px}
.time{font-size:26px;font-weight:900;min-width:120px}.name{font-size:23px;font-weight:900}.type{font-size:18px;font-weight:800;color:#737b8c;margin-top:4px}
.green{background:#7bc43c}.yellow{background:#f0bd3e}.blue{background:#8fd8e8}
.empty{background:white;border-radius:26px;padding:28px;text-align:center;font-weight:700;color:#777}
@media(max-width:520px){.next{font-size:34px}.time{min-width:105px;font-size:22px}.name{font-size:20px}.type{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="kicker">Próxima clase</div>
    <div id="next" class="next">—</div>
    <div id="nextSub" class="sub">—</div>
  </section>
  <div id="days" class="days"></div>
  <main id="list"></main>
</div>
<script>
const days=[
 {key:"2026-10-08",label:"Jue 8",classes:[
  ["16:30","17:30","Oscar Joya","Escuela","green"],
  ["17:30","18:30","Oscar Joya","Particular","yellow"],
  ["18:30","19:30","Oscar Joya","Escuela","green"],
  ["19:30","20:30","Oscar Joya","Escuela","green"],
  ["20:30","22:00","Oscar Joya","Escuela","green"]
 ]},
 {key:"2026-10-09",label:"Vie 9",classes:[
  ["09:00","10:00","Oscar Joya","Particular","yellow"],
  ["18:00","19:00","Oscar Joya","Escuela","green"],
  ["19:00","20:00","Oscar Joya","Escuela","green"]
 ]},
 {key:"2026-10-10",label:"Sáb 10",classes:[
  ["09:00","10:00","Oscar Joya","Escuela","green"],
  ["10:00","11:00","Oscar Joya","Temática","blue"],
  ["11:00","12:00","Oscar Joya","Particular","yellow"],
  ["12:00","13:00","Oscar Joya","Particular","yellow"]
 ]}
];

let selected=0;
function renderDays(){
 document.getElementById("days").innerHTML=days.map((d,i)=>
  `<button class="${i===selected?'active':''}" onclick="selectDay(${i})">${d.label}</button>`).join("");
}
function render(){
 const d=days[selected];
 const now=new Date();
 const today=now.toISOString().slice(0,10);
 let upcoming=d.classes[0];
 if(d.key===today){
   upcoming=d.classes.find(c=>{
     const [h,m]=c[0].split(":").map(Number);
     return h*60+m >= now.getHours()*60+now.getMinutes();
   }) || d.classes[d.classes.length-1];
 }
 document.getElementById("next").textContent=`${upcoming[0]} · ${upcoming[2]}`;
 document.getElementById("nextSub").textContent=`${d.label} · ${upcoming[3]}`;
 document.getElementById("list").innerHTML=d.classes.map(c=>`
  <article class="card">
   <div class="bar ${c[4]}"></div>
   <div class="time">${c[0]}–${c[1]}</div>
   <div><div class="name">${c[2]}</div><div class="type">${c[3]}</div></div>
  </article>`).join("");
 renderDays();
}
function selectDay(i){selected=i;render()}
render();
</script>
</body>
</html>
